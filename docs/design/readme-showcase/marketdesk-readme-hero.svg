<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" data-od-id="marketdesk-desktop-workspace">
  <title id="title">MarketDesk — desktop seller workspace concept</title>
  <desc id="desc">A wide desktop-first MarketDesk workspace with persistent navigation, a catalog and listings table, the validated OLX provider, illustrative analytics, roadmap channels, and Hermes proposals that require human review. All interface content is synthetic illustrative demo data; no unattended automation or production metrics are shown.</desc>
  <defs>
    <style>
      .display{font:600 34px Georgia,'Times New Roman',serif;letter-spacing:-.8px;fill:#202238}
      .body{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#525468}
      .nav{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#4b4d60}
      .small{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#4f5265}
      .smallStrong{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#202238}
      .meta{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#66697a}
      .label{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.9px;fill:#686a7a}
      .cardhead{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#202238}
      .metric{font:600 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#202238}
      .ink{fill:#202238}.muted{fill:#737486}.line{stroke:#e1e0dd}.purple{fill:#5B55E7}
    </style>
  </defs>
