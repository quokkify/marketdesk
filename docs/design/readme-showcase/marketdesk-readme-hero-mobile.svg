<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 0 344 930" role="img" aria-labelledby="title desc">
  <title id="title">MarketDesk — mobile workspace concept</title>
  <desc id="desc">A narrow, vertically composed concept view of a workspace-scoped product catalog, its OLX-only provider state, illustrative analytics without live numbers, and one Hermes proposal with a human review action. All interface data is synthetic. Other channels are roadmap items. Prototype, not production-certified.</desc>
  <defs>
    <style>
      .display{font:600 27px Georgia,'Times New Roman',serif;letter-spacing:-.45px;fill:#202238}
      .body{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#3f4255}
      .small{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#414456}
      .tiny{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#4d5061}
      .label{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.45px;fill:#55586a}
      .cardhead{font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#202238}
      .line{stroke:#deddd9}
    </style>
  </defs>
  <rect width="360" height="930" fill="#f7f6f2"/>
  <circle cx="28" cy="29" r="22" fill="#5B55E7"/>
  <path fill="#FFFFFF" transform="translate(12 13) scale(1.3333333)" d="m21.9 7.89-1.05-3.37C20.63 3.62 19.85 3 18.94 3H5.05c-.9 0-1.69.63-1.9 1.52L2.1 7.89c-.46 1.97.85 3.11.9 3.17V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7.94c1.12-1.12 1.09-2.41.9-3.17M13 5h1.96l.54 3.52c.09.71-.39 1.48-1.28 1.48-.67 0-1.22-.59-1.22-1.31zM6.44 8.86c-.08.65-.6 1.14-1.21 1.14-.93 0-1.35-.97-1.19-1.64L5.05 5h1.97zM11 8.69c0 .72-.55 1.31-1.29 1.31-.75 0-1.3-.7-1.22-1.48L9.04 5H11zM18.77 10c-.61 0-1.14-.49-1.21-1.14L16.98 5l1.93-.01 1.05 3.37c.16.67-.25 1.64-1.19 1.64"/>
  <text x="60" y="27" class="cardhead">MarketDesk</text>
  <text x="60" y="47" class="tiny">WORKSPACE · NORTHSTAR GOODS</text>
