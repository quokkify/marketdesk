tasks.withType(Test).configureEach {
    useTestNG()
    systemProperty 'file.encoding', 'UTF-8'
    // Forward this explicit override to the separate test JVM.
    def baseUri = System.getProperty('MARKETDESK_API_BASE_URI')
    if (baseUri != null) {
        systemProperty 'MARKETDESK_API_BASE_URI', baseUri
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// Keep the default suite safe for fast local development. Live HTTP checks are
// explicitly selected by `apiTest` and run against the Compose application in CI.
tasks.named('test', Test) {
    useTestNG {
        excludeGroups 'api'
    }
}

tasks.register('apiTest', Test) {
    description = 'Runs API tests against a running MarketDesk application.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useTestNG {
        includeGroups 'api'
    }
    // The result depends on the running application, which Gradle cannot see as an input.
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named('test')
}
