checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configDirectory.set(file('tools/checkstyle'))
}

tasks.withType(Checkstyle).configureEach {
    maxWarnings = 0
    showViolations = true
    reports {
        xml.required = System.getenv('CI') != null
        html.required = System.getenv('CI') == null
    }
}

// Applied scripts resolve plugin types through the plugin's class loader.
def spotbugsClassLoader = plugins['com.github.spotbugs'].class.classLoader
def SpotBugsEffort = spotbugsClassLoader.loadClass('com.github.spotbugs.snom.Effort')
def SpotBugsConfidence = spotbugsClassLoader.loadClass('com.github.spotbugs.snom.Confidence')

spotbugs {
    effort = SpotBugsEffort.valueOf('MAX')
    reportLevel = SpotBugsConfidence.valueOf('DEFAULT')
    excludeFilter = file('tools/spotbugs/excludeFilter.xml')
}

['spotbugsMain', 'spotbugsTest'].each { taskName ->
    tasks.named(taskName).configure {
        reports {
            xml { required = true }
            html {
                required = true
                stylesheet = 'fancy-hist.xsl'
            }
        }
    }
}
